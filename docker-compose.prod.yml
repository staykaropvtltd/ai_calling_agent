# ============================================================
# Staykaro AI Caller — Production Compose Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile all up -d
#
# This file only overrides what differs in production.
# The base docker-compose.yml remains the source of truth
# for service definitions, healthchecks, and volumes.
# ============================================================

services:

  # Expose nginx publicly (base binds to 127.0.0.1 for dev safety).
  nginx:
    ports:
      - "0.0.0.0:80:80"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # No external port in production — only accessible inside Docker network.
  postgres:
    ports: []

  redis:
    ports: []

  api:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  voice-gateway:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  integration-service:
    ports: []   # not public-facing; route through nginx when needed
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
