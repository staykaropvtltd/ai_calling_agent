# ============================================================
# Staykaro AI Caller — Production Compose Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile all up -d
#
# This file only overrides what differs in production.
# The base docker-compose.yml remains the source of truth
# for service definitions, healthchecks, and volumes.
#
# Prerequisites before first run:
#   1. Set DOMAIN in /opt/staykaro/.env
#   2. Run scripts/setup-vps.sh to provision certbot certs
#   3. Ensure /etc/letsencrypt/live/${DOMAIN}/ exists with
#      fullchain.pem and privkey.pem
# ============================================================

services:

  # NH-03: Expose nginx publicly (base binds to 127.0.0.1 for dev safety).
  # Use nginx.prod.conf which adds HTTPS + WSS + HTTP→HTTPS redirect.
  # Certs are mounted read-only from the certbot-provisioned path.
  nginx:
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      # Override the embedded dev config with the prod config at runtime.
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certs — provisioned by scripts/setup-vps.sh (certbot).
      # DOMAIN env var must be set in .env before running this stack.
      - /etc/letsencrypt/live/${DOMAIN}:/etc/nginx/ssl:ro
      # ACME challenge directory for certbot renewals (HTTP-01 challenge).
      - /var/www/certbot:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # No external port in production — only accessible inside Docker network.
  # `!override` is required, not plain `ports: []`: Compose's default merge
  # for list-type keys is concatenation, so a bare `[]` here would add zero
  # entries on top of the base file's port mapping rather than clearing it —
  # found while wiring admin-dashboard's own `ports: []` below and verifying
  # it with `docker compose config` (base ports were still present).
  postgres:
    ports: !override []

  redis:
    ports: !override []

  api:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  voice-gateway:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  integration-service:
    ports: !override []   # not public-facing; route through nginx when needed
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  admin-dashboard:
    ports: !override []   # not public-facing; nginx proxies /admin/ (see nginx.prod.conf)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
