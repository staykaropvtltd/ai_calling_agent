worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        server_tokens off;

        # Gateway status — exact match only
        location = / {
            add_header Content-Type application/json always;
            return 200 '{"service":"staykaro-gateway","status":"ok"}';
        }

        # /internal/* is the service-to-service API the voice gateway calls
        # directly over the Docker network (INTERNAL_API_URL=http://api:8000) —
        # it must never be reachable through this public-facing proxy, token
        # auth on the API itself (src/routers/internal.py) is defense in depth,
        # not a substitute for this. Longest-prefix match means this always
        # wins over the /api/ block below regardless of declaration order.
        location /api/internal/ {
            return 404;
        }

        # Route /api/* → api:8000
        # Trailing slash on proxy_pass strips the /api prefix:
        #   /api/health → /health
        #   /api/call   → /call
        location /api/ {
            proxy_pass         http://api:8000/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # Client call portal — static HTML
        location = /portal {
            root /usr/share/nginx/html;
            try_files /portal.html =404;
            add_header Cache-Control "no-cache";
        }

        # Admin dashboard (NH-06/07/08) — Next.js, basePath: '/admin',
        # trailingSlash: true (see apps/admin-dashboard/next.config.js).
        # The exact-match redirect below sends the bare `/admin` (no
        # trailing slash) to the canonical `/admin/` this prefix location
        # matches — a *prefix* match on bare `/admin` would also swallow
        # any future `/adminfoo`-style route, and redirecting the other
        # way (canonicalizing to no-slash) loops forever against Next's own
        # trailing-slash redirect (confirmed by hand: without
        # trailingSlash: true and this exact-match block, `curl -IL
        # http://localhost/admin` looped 301/308 indefinitely).
        location = /admin {
            return 301 /admin/;
        }

        # No trailing slash on proxy_pass's target, unlike /api/ above: the
        # full /admin/ prefix is forwarded as-is because the upstream app
        # expects it.
        location /admin/ {
            proxy_pass         http://admin-dashboard:3000;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # Client dashboard — Next.js, basePath: '/client', trailingSlash: true
        # (see apps/client-dashboard/next.config.js). Same redirect-loop
        # rationale as /admin above.
        location = /client {
            return 301 /client/;
        }

        location /client/ {
            proxy_pass         http://client-dashboard:3000;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # Reject everything else
        location / {
            return 404;
        }
    }
}
