# ============================================================
# Staykaro AI Caller — Production Nginx Configuration
# NH-03: HTTPS termination + HTTP→HTTPS redirect + WSS proxy
#
# Certs are mounted at /etc/nginx/ssl/ by docker-compose.prod.yml:
#   - /etc/nginx/ssl/fullchain.pem
#   - /etc/nginx/ssl/privkey.pem
# Provision with: scripts/setup-vps.sh (certbot step)
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;
        server_tokens off;

        # Allow ACME challenges from certbot to pass through before redirect.
        # (certbot renew uses HTTP on port 80)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;
        server_tokens off;

        # ── TLS ───────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ───────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Gateway status ─────────────────────────────────────
        location = / {
            add_header Content-Type application/json always;
            return 200 '{"service":"staykaro-gateway","status":"ok","tls":true}';
        }

        # /internal/* is the service-to-service API the voice gateway calls
        # directly over the Docker network (INTERNAL_API_URL=http://api:8000) —
        # it must never be reachable through this public-facing proxy, token
        # auth on the API itself (src/routers/internal.py) is defense in depth,
        # not a substitute for this. Longest-prefix match means this always
        # wins over the /api/ block below regardless of declaration order.
        location /api/internal/ {
            return 404;
        }

        # ── API proxy → api:8000 ───────────────────────────────
        # Trailing slash strips the /api prefix:
        #   /api/health → /health
        #   /api/admin/clients → /admin/clients
        location /api/ {
            proxy_pass         http://api:8000/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket proxy → voice-gateway:9000 ──────────────
        # Infrastructure-ready: routes WSS traffic to voice-gateway.
        # The actual WS endpoint handlers are Shivashree's (SH-XX).
        # When voice-gateway adds /ws/* routes they work through here.
        location /ws/ {
            proxy_pass              http://voice-gateway:9000/;
            proxy_http_version      1.1;

            # WebSocket upgrade headers — required for protocol switch
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection "upgrade";

            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Long timeouts — WebSocket connections are long-lived
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
            proxy_connect_timeout   10s;
        }

        # ── Client portal — static HTML ────────────────────────
        location = /portal {
            root /usr/share/nginx/html;
            try_files /portal.html =404;
            add_header Cache-Control "no-cache";
        }

        # ── Reject everything else ─────────────────────────────
        location / {
            return 404;
        }
    }
}
