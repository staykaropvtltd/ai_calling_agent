<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staykaro — Call Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-text p  { font-size: 12px; color: #94a3b8; margin-top: 1px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #475569; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      line-height: 1.5;
    }
    .alert.success { background: #052e16; border: 1px solid #16a34a; color: #86efac; }
    .alert.error   { background: #2d0a0a; border: 1px solid #dc2626; color: #fca5a5; }

    .call-id {
      margin-top: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📞</div>
      <div class="logo-text">
        <h1>Staykaro</h1>
        <p>AI Calling Portal</p>
      </div>
    </div>

    <form id="callForm">
      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="customer_name" placeholder="e.g. Raj Kumar" required />
      </div>

      <div class="field">
        <label>Phone Number (E.164)</label>
        <input type="tel" id="phone_number" placeholder="+919876543210" required />
      </div>

      <div class="field">
        <label>Hotel Name</label>
        <input type="text" id="hotel_name" placeholder="e.g. Taj Palace, Mumbai" required />
      </div>

      <div class="row">
        <div class="field">
          <label>Check-in Date</label>
          <input type="date" id="check_in_date" required />
        </div>
        <div class="field">
          <label>Check-out Date</label>
          <input type="date" id="check_out_date" required />
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">📲 Initiate Call</span>
      </button>
    </form>

    <div class="alert" id="alert"></div>
  </div>

  <script>
    const API = '/api';

    async function getToken() {
      const res = await fetch(`${API}/auth/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'username=admin&password=calling_agent_2026',
      });
      if (!res.ok) throw new Error('Authentication failed');
      const data = await res.json();
      return data.access_token;
    }

    async function triggerCall(token, payload) {
      const res = await fetch(`${API}/call`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        const msg = data.detail
          || (data.detail && data.detail[0]?.msg)
          || JSON.stringify(data);
        throw new Error(msg);
      }
      return data;
    }

    function setLoading(loading) {
      const btn     = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const text    = document.getElementById('btnText');
      btn.disabled          = loading;
      spinner.style.display = loading ? 'block' : 'none';
      text.textContent      = loading ? 'Calling…' : '📲 Initiate Call';
    }

    function showAlert(type, html) {
      const el = document.getElementById('alert');
      el.className     = `alert ${type}`;
      el.innerHTML     = html;
      el.style.display = 'block';
    }

    document.getElementById('callForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('alert').style.display = 'none';
      setLoading(true);

      const payload = {
        customer_name:  document.getElementById('customer_name').value.trim(),
        phone_number:   document.getElementById('phone_number').value.trim(),
        hotel_name:     document.getElementById('hotel_name').value.trim(),
        check_in_date:  document.getElementById('check_in_date').value,
        check_out_date: document.getElementById('check_out_date').value,
      };

      try {
        const token  = await getToken();
        const result = await triggerCall(token, payload);
        showAlert('success',
          `✅ <strong>Call initiated successfully!</strong><br/>
           ${payload.customer_name} will receive a call shortly.<br/>
           <div class="call-id">Call ID: ${result.call_id}</div>`
        );
        e.target.reset();
      } catch (err) {
        showAlert('error', `❌ <strong>Failed to initiate call.</strong><br/>${err.message}`);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
