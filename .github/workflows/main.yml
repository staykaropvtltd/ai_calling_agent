name: CI

# ─── Triggers ────────────────────────────────────────────────────────────────
# Runs on every push to protected branches, every PR targeting main,
# and can be triggered manually from the GitHub Actions UI.
on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   # Manual run button in GitHub UI

# Cancel redundant runs on the same branch to avoid wasting minutes.
# A new push to a feature branch cancels the in-progress run for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint
  # Fastest job. All other jobs depend on this passing first.
  # Catches: import order, unused vars, undefined names, bugbear patterns.
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint — app/
        run: ruff check app/

      - name: Lint — services/
        run: ruff check services/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2 — Unit Tests
  # Runs after lint passes. All dependencies are mocked — no real Redis or
  # PostgreSQL is spun up. REDIS_URL / DATABASE_URL must be set so
  # module-level client objects can be constructed at import time.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "Unit Tests (pytest)"
    runs-on: ubuntu-latest
    needs: [lint]

    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      BLAND_API_KEY: ci_dummy_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip          # caches pip packages across runs

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest app/tests/ \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3 — Docker Build Validation
  # Runs in parallel with tests (both need lint, not each other).
  # Each service is built independently so a failure names the exact service.
  # Images are NOT pushed — this is validation only.
  # Layer cache is stored per-service in GitHub's Action Cache.
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build Validation"
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate nginx config before wasting time on image builds.
      # docker run is cheap; a broken nginx.conf surfaces immediately.
      - name: Validate nginx.conf syntax
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

      - name: "Build — api"
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: "Build — voice-gateway"
        uses: docker/build-push-action@v6
        with:
          context: ./services/voice-gateway
          file: ./services/voice-gateway/Dockerfile
          push: false
          cache-from: type=gha,scope=voice-gateway
          cache-to: type=gha,mode=max,scope=voice-gateway

      - name: "Build — worker"
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: "Build — integration-service"
        uses: docker/build-push-action@v6
        with:
          context: ./services/integration-service
          file: ./services/integration-service/Dockerfile
          push: false
          cache-from: type=gha,scope=integration-service
          cache-to: type=gha,mode=max,scope=integration-service

      - name: "Build — nginx"
        uses: docker/build-push-action@v6
        with:
          context: ./infrastructure/nginx
          file: ./infrastructure/nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
