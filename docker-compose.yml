# ============================================
# STAYKARO AI CALLER — Docker Compose
# Version: 1.0.2
# Phase: NH-01 — Engineering Foundation
# ============================================

services:

  # ==========================================
  # One-shot init: fix ownership on the postgres_backups volume
  # ==========================================
  # A freshly created named volume is root:root — the postgres process inside
  # the postgres container runs as uid 999 (confirmed by hand:
  # `docker exec staykaro-postgres id postgres`) and cannot mkdir/write into a
  # root-owned mount, which silently breaks archive_command (WAL archiving
  # fails permission-denied, forever, until this runs). Runs once as root,
  # chowns to 999:999 to match, then exits; postgres waits for it to finish
  # successfully before starting.
  backups-volume-init:
    image: busybox
    container_name: staykaro-backups-volume-init
    command: sh -c "mkdir -p /backups/wal_archive /backups/base && chown -R 999:999 /backups"
    volumes:
      - postgres_backups:/backups

  # ==========================================
  # PostgreSQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: staykaro-postgres
    restart: unless-stopped

    depends_on:
      backups-volume-init:
        condition: service_completed_successfully

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staykaro}
      POSTGRES_USER: ${POSTGRES_USER:-staykaro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}

    # NK-17 — continuous WAL archiving, so scripts/backup-db.sh's daily base
    # backup plus the archived segments give point-in-time recovery (Database
    # Design §10: "Daily full, continuous WAL"), not just a daily snapshot.
    # archive_command copies each completed segment into postgres_backups
    # (mounted below) — a *separate* volume from postgres_data on purpose,
    # so losing the data volume doesn't also take the WAL archive with it.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backups/wal_archive && test ! -f /backups/wal_archive/%f && cp %p /backups/wal_archive/%f
      - -c
      - max_wal_senders=3

    # Existing Windows PostgreSQL uses 5432.
    # Windows: localhost:5433
    # Docker internal: postgres:5432
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-staykaro_user} -d ${POSTGRES_DB:-staykaro}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Redis — Live Call State & Caching
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: staykaro-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--save", "60", "1000",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--requirepass", "${REDIS_PASSWORD}",
        "--loglevel", "${REDIS_LOG_LEVEL:-notice}"
      ]

    # Existing Windows Redis uses 6379.
    # Windows: localhost:6380
    # Docker internal: redis:6379
    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # API Service — FastAPI
  # Owner: Nishkala
  # ==========================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile

    container_name: staykaro-api
    restart: unless-stopped

    environment:
      # DATABASE_URL: the restricted staykaro_app role — what uvicorn serves
      # traffic as, and the role NK-07's RLS policies actually restrict.
      DATABASE_URL: ${DATABASE_URL}
      # MIGRATION_DATABASE_URL: staykaro_user (superuser) — docker-entrypoint.sh
      # runs `alembic upgrade head` with this before uvicorn starts. Superusers
      # always bypass RLS, which is exactly why the app itself must not use it.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # The bundled pgvector/postgres container below has no SSL configured.
      # src/config.py defaults DB_SSL_REQUIRED to "true" (correct for a real
      # Supabase target, which mandates TLS) — without this override, both
      # the app and `alembic upgrade head` in docker-entrypoint.sh fail to
      # connect to the local postgres service at all. Override to true (or
      # unset this line) when DATABASE_URL/MIGRATION_DATABASE_URL point at a
      # TLS-requiring host like Supabase instead of the local container.
      DB_SSL_REQUIRED: ${DB_SSL_REQUIRED:-false}
      REDIS_URL: ${REDIS_URL}
      BLAND_API_KEY: ${BLAND_API_KEY}

      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Browser origins allowed to call this API directly (see src/main.py's
      # CORSMiddleware wiring) — was documented in .env.example but never
      # actually passed through to the container until now.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}

      API_SECRET_KEY: ${API_SECRET_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Shared secret the voice gateway must present to call /internal/v1/*
      # (see services/api/src/routers/internal.py::verify_internal_token).
      # Must match the voice-gateway service's own INTERNAL_API_TOKEN below.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Nginx — Reverse Proxy
  # NH-03: API only
  # Host port bindings are declared per-environment:
  #   dev  → docker-compose.override.yml (127.0.0.1:80)
  #   prod → docker-compose.prod.yml     (0.0.0.0:80 + 0.0.0.0:443)
  # ==========================================
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile

    container_name: staykaro-nginx
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Voice Gateway — Pipecat
  # Owner: Shivashree
  # ==========================================
  voice-gateway:
    build:
      context: ./services/voice-gateway
      dockerfile: Dockerfile

    container_name: staykaro-voice-gateway
    restart: unless-stopped

    environment:
      REDIS_URL: ${REDIS_URL}

      VOICE_GATEWAY_HOST: ${VOICE_GATEWAY_HOST:-0.0.0.0}
      VOICE_GATEWAY_PORT: ${VOICE_GATEWAY_PORT:-9000}

      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-twilio}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      # Exotel callback integration (SH-01/SH-02)
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_SECRET: ${EXOTEL_API_SECRET:-}
      EXOTEL_SID: ${EXOTEL_SID:-}
      EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-}
      EXOTEL_CALLER_ID: ${EXOTEL_CALLER_ID:-}
      EXOTEL_WEBHOOK_TOKEN: ${EXOTEL_WEBHOOK_TOKEN:-}

      # Base URL for the internal calls API (services/api)
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      # Shared secret required by services/api's /internal/v1/* — must match
      # the api service's own INTERNAL_API_TOKEN above.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      # Set to "true" to enable the dev-only test routing stub (one phone number only)
      EXOTEL_DEV_ROUTING: ${EXOTEL_DEV_ROUTING:-}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    ports:
      - "127.0.0.1:9000:9000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    profiles:
      - all

  # ==========================================
  # Worker
  # Owner: Nishkala
  # ==========================================
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile

    container_name: staykaro-worker
    restart: unless-stopped

    environment:
      # Queue wake-up signal only — PostgreSQL (owned exclusively by the api
      # service) is where job state actually lives; the worker never opens
      # its own DB connection (see services/worker/src/main.py's module
      # docstring), so no DATABASE_URL is wired here.
      REDIS_URL: ${REDIS_URL}

      # Durable job state: create/claim/complete/fail/reap, all through
      # services/api's internal job API.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # The one real internal integration contract this repo defines
      # (services/integration-service's /internal/v1/process).
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL:-http://integration-service:8002}

      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-service:
        condition: service_healthy

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    profiles:
      - all

  # ==========================================
  # Integration Service
  # Owner: Nihal
  # ==========================================
  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile

    container_name: staykaro-integration-service
    restart: unless-stopped

    environment:
      # No DATABASE_URL: this service owns no PostgreSQL connection of its
      # own (Constraint #1/#2 — application data stays owned by the api
      # service); Redis is used only for its own /health check.
      REDIS_URL: ${REDIS_URL}
      # Shared secret required by /internal/v1/process (same mechanism as
      # services/api's /internal/v1/* — see src/main.py::verify_internal_token).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      INTEGRATION_SERVICE_PORT: ${INTEGRATION_SERVICE_PORT:-8002}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    ports:
      - "127.0.0.1:8002:8002"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8002/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    profiles:
      - all

  # ==========================================
  # Admin Dashboard — Next.js (NH-06/07/08)
  # Owner: Nihal
  # ==========================================
  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* into the client bundle at build time —
        # this must be a build arg, not a runtime `environment:` entry, or the
        # browser bundle would silently keep whatever value was baked in at
        # image-build time regardless of what's set here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}

    container_name: staykaro-admin-dashboard
    restart: unless-stopped

    # Exposed directly (matching API_CORS_ORIGINS' reserved localhost:3000 in
    # .env.example) so `npm run dev` outside Docker and this container can
    # both be reached the same way in local dev; nginx also proxies /admin/
    # for the same-origin path in both dev and prod (infrastructure/nginx).
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      # 127.0.0.1, not localhost: this Alpine image resolves "localhost" to
      # ::1 first, and the Next.js server only accepts IPv4 connections —
      # confirmed by hand (a hostname-based check gets "connection refused"
      # while the app is actually up and serving fine).
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/admin/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    profiles:
      - all

  # ==========================================
  # Client Dashboard — Next.js
  # Tenant-facing app (tenant_admin/agent): place calls, view own users/calls.
  # ==========================================
  client-dashboard:
    build:
      context: ./apps/client-dashboard
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* into the client bundle at build time —
        # this must be a build arg, not a runtime `environment:` entry, or the
        # browser bundle would silently keep whatever value was baked in at
        # image-build time regardless of what's set here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}

    container_name: staykaro-client-dashboard
    restart: unless-stopped

    # Exposed directly (matching API_CORS_ORIGINS' reserved localhost:3001 in
    # .env.example) so `npm run dev` outside Docker and this container can
    # both be reached the same way in local dev; nginx also proxies /client/
    # for the same-origin path in both dev and prod (infrastructure/nginx).
    ports:
      - "127.0.0.1:3001:3000"

    healthcheck:
      # 127.0.0.1, not localhost — see admin-dashboard's healthcheck above
      # for why (Alpine resolves localhost to ::1 first; Next only binds IPv4).
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/client/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staykaro-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    profiles:
      - all


# ==========================================
# Persistent Volumes
# ==========================================
volumes:

  postgres_data:
    name: staykaro_postgres_data
    driver: local

  # NK-17 — base backups + WAL archive (scripts/backup-db.sh,
  # scripts/restore-db.sh). Deliberately a separate volume from postgres_data
  # so a corrupted/deleted data volume doesn't take the backups with it — in
  # production this should additionally be synced off-host (Database Design
  # §10: "stored separately from the production VPS"); that sync step is an
  # operator/ops decision (destination, credentials) left to deployment
  # config, not scripted here.
  postgres_backups:
    name: staykaro_postgres_backups
    driver: local

  redis_data:
    name: staykaro_redis_data
    driver: local


# ==========================================
# Internal Docker Network
# ==========================================
networks:

  staykaro-network:
    name: staykaro-network
    driver: bridge