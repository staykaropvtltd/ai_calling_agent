[pytest]
testpaths = app/tests services/api/tests tests services/worker/tests services/integration-service/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Both app/ (root) and services/api/ (for `from src.xxx import`) must be on path.
# services/worker and services/integration-service are deliberately NOT added
# here — their own `src` packages would collide with services/api's (already
# claimed under the plain name `src` the moment services/api/tests/conftest.py
# runs `from src.main import app`). Their test files load their modules under
# private names instead (see services/worker/tests/test_worker.py and
# services/integration-service/tests/test_process.py), the same technique
# tests/test_gateway_callbacks.py already uses for services/voice-gateway.
pythonpath = . services/api
# pytest-asyncio: auto-handle async test functions (no @pytest.mark.asyncio needed per test)
asyncio_mode = auto
